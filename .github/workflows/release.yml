name: Signed container release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Block release until licensed TOEIC production media is complete
        shell: pwsh
        run: ./scripts/Test-ToeicMediaManifest.ps1 -Mode Production

      - name: Set up .NET for live release evaluation
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Require live AI evaluation secret
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Configure the OPENAI_API_KEY repository secret before release."
            exit 1
          fi

      - name: Run fixed-dataset live AI release gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_EVAL_MODEL: gpt-5.6-luna
          AI_EVAL_INPUT_USD_PER_MILLION: "1"
          AI_EVAL_OUTPUT_USD_PER_MILLION: "6"
          AI_EVAL_MAX_COST_USD: "0.50"
        run: >
          dotnet run
          --project tools/EnglishMasterAI.AiEval/EnglishMasterAI.AiEval.csproj
          --configuration Release
          --
          --dataset evals/ai-feedback-golden.json
          --report artifacts/ai-eval/report.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive immutable image metadata
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,format=long

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: false
          sbom: false

      - name: Create release evidence directory
        run: mkdir -p artifacts

      - name: Generate SBOM from immutable image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: artifacts/release.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest-sbom@51e74621a501c89df81fc1391c5a8f4cfc9fab2f # v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: artifacts/release.spdx.json
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Sign immutable image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >
          cosign sign --yes
          "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Record deployment digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p artifacts
          printf 'APP_IMAGE=%s/%s@%s\n' "$REGISTRY" "$IMAGE_NAME" "$DIGEST" \
            > artifacts/deployment-image.env

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-release-evidence
          path: |
            artifacts/deployment-image.env
            artifacts/release.spdx.json
            artifacts/ai-eval/report.json
          retention-days: 90
