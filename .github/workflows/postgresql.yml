name: PostgreSQL migration and restore

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: englishmaster
          POSTGRES_USER: englishmaster
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U englishmaster -d englishmaster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: ci-password
      POSTGRES_CONNECTION_STRING: Host=localhost;Port=5432;Database=englishmaster;Username=englishmaster;Password=ci-password
      POSTGRES_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=englishmaster;Username=englishmaster;Password=ci-password

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      # pg_dump refuses to dump from a server newer than itself, and the runner
      # ships a 16.x client. Keep this major version in step with the postgres
      # service image above.
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-17
          # Bare `pg_dump --version` reports the wrapper default (16), not what
          # runs against the service; pg_wrapper picks the client by server
          # version at connect time. Assert the 17 binary itself is present.
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Restore tools and packages
        run: |
          dotnet tool restore
          dotnet restore EnglishMasterAI.sln

      - name: Build solution
        run: dotnet build EnglishMasterAI.sln --configuration Release --no-restore

      - name: Run one-off migration and seed job twice
        env:
          ASPNETCORE_ENVIRONMENT: Staging
          Database__Provider: PostgreSql
          Database__ConnectionStringName: PostgreSqlConnection
          Database__ApplyMigrationsOnStartup: "false"
          Database__SeedOnStartup: "false"
          ConnectionStrings__PostgreSqlConnection: Host=localhost;Port=5432;Database=englishmaster;Username=englishmaster;Password=ci-password
          SeedAdmin__Enabled: "false"
        run: |
          dotnet run --project src/EnglishMasterAI.Web/EnglishMasterAI.Web.csproj \
            --configuration Release --no-build -- --migrate-and-seed
          dotnet run --project src/EnglishMasterAI.Web/EnglishMasterAI.Web.csproj \
            --configuration Release --no-build -- --migrate-and-seed

      - name: Run PostgreSQL integration tests
        run: >
          dotnet test tests/EnglishMasterAI.Tests/EnglishMasterAI.Tests.csproj
          --configuration Release
          --no-build
          --filter "Category=PostgreSql"

      - name: Create and restore backup
        run: |
          psql -h localhost -U englishmaster -d englishmaster -v ON_ERROR_STOP=1 \
            -c 'CREATE TABLE backup_restore_probe (id integer PRIMARY KEY, value text NOT NULL);' \
            -c "INSERT INTO backup_restore_probe VALUES (1, 'verified');"
          pg_dump -h localhost -U englishmaster -d englishmaster --format=custom \
            --file=artifacts-postgres.dump
          createdb -h localhost -U englishmaster englishmaster_restore_test
          pg_restore -h localhost -U englishmaster -d englishmaster_restore_test \
            --exit-on-error artifacts-postgres.dump
          test "$(psql -h localhost -U englishmaster -d englishmaster_restore_test -Atc \
            "SELECT value FROM backup_restore_probe WHERE id = 1;")" = "verified"
          dropdb -h localhost -U englishmaster englishmaster_restore_test

      - name: Upload backup verification artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgres-restore-test
          path: artifacts-postgres.dump
          retention-days: 3
