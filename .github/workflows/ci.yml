name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Restore
        run: dotnet restore EnglishMasterAI.sln

      - name: Verify formatting
        run: dotnet format EnglishMasterAI.sln --verify-no-changes --no-restore

      - name: Validate TOEIC media manifest structure
        shell: pwsh
        run: ./scripts/Test-ToeicMediaManifest.ps1 -Mode Draft

      - name: Build
        run: dotnet build EnglishMasterAI.sln --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test tests/EnglishMasterAI.Tests/EnglishMasterAI.Tests.csproj
          --configuration Release
          --no-build
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=tests.trx"
          --results-directory artifacts/test-results

      - name: Enforce coverage threshold
        shell: pwsh
        run: |
          $reports = Get-ChildItem artifacts/test-results -Recurse -Filter coverage.cobertura.xml |
            Select-Object -ExpandProperty FullName
          ./scripts/Test-CoverageThreshold.ps1 `
            -CoverageFile $reports `
            -MinimumLinePercent 60 `
            -MinimumBranchPercent 40

      - name: Scan NuGet dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $scan = dotnet list EnglishMasterAI.sln package --vulnerable --include-transitive 2>&1 | Out-String
          $scan | Tee-Object -FilePath artifacts/nuget-vulnerabilities.txt
          if ($LASTEXITCODE -ne 0) {
            throw "NuGet vulnerability scan failed to execute."
          }
          if ($scan -match "has the following vulnerable packages") {
            throw "A vulnerable NuGet package was detected."
          }

      - name: Build container
        run: docker build --tag englishmaster-ai:ci .

      - name: Scan container for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: englishmaster-ai:ci
          format: sarif
          output: artifacts/trivy.sarif
          severity: HIGH,CRITICAL
          # Without this, the action unsets severity whenever format is sarif,
          # so exit-code would gate on every LOW and MEDIUM finding too.
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate container SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: englishmaster-ai:ci
          format: spdx-json
          output-file: artifacts/englishmaster-ai.spdx.json

      - name: Upload test and security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-reports
          path: |
            artifacts/test-results
            artifacts/nuget-vulnerabilities.txt
            artifacts/trivy.sarif
            artifacts/englishmaster-ai.spdx.json
          if-no-files-found: warn
