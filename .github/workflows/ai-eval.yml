name: Live AI evaluation

on:
  schedule:
    - cron: "17 2 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_EVAL_MODEL: gpt-5.6-luna
      AI_EVAL_INPUT_USD_PER_MILLION: "1"
      AI_EVAL_OUTPUT_USD_PER_MILLION: "6"
      AI_EVAL_MAX_COST_USD: "0.50"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Require live evaluation secret
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Configure the OPENAI_API_KEY repository secret."
            exit 1
          fi

      - name: Run fixed-dataset evaluation
        run: >
          dotnet run
          --project tools/EnglishMasterAI.AiEval/EnglishMasterAI.AiEval.csproj
          --configuration Release
          --
          --dataset evals/ai-feedback-golden.json
          --report artifacts/ai-eval/report.json

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-ai-evaluation
          path: artifacts/ai-eval/report.json
          if-no-files-found: warn
          retention-days: 30
