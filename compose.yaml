name: englishmaster

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-englishmaster}
      POSTGRES_USER: ${POSTGRES_USER:-englishmaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-englishmaster} -d ${POSTGRES_DB:-englishmaster}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migration:
    build:
      context: .
    restart: "no"
    command: ["dotnet", "EnglishMasterAI.Web.dll", "--migrate-and-seed"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      AllowedHosts: ${ALLOWED_HOSTS:-localhost}
      Database__Provider: PostgreSql
      Database__ConnectionStringName: PostgreSqlConnection
      Database__ApplyMigrationsOnStartup: "false"
      Database__SeedOnStartup: "false"
      ConnectionStrings__PostgreSqlConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-englishmaster};Username=${POSTGRES_USER:-englishmaster};Password=${POSTGRES_PASSWORD:-change-me-local-only}
      Security__RequireConfirmedAccount: "false"
      SeedAdmin__Enabled: "false"

  web:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      AllowedHosts: ${ALLOWED_HOSTS:-localhost}
      Database__Provider: PostgreSql
      Database__ConnectionStringName: PostgreSqlConnection
      Database__ApplyMigrationsOnStartup: "false"
      Database__SeedOnStartup: "false"
      ConnectionStrings__PostgreSqlConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-englishmaster};Username=${POSTGRES_USER:-englishmaster};Password=${POSTGRES_PASSWORD:-change-me-local-only}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      ConnectionStrings__AudioBlobStorage: ${AUDIO_BLOB_CONNECTION_STRING:-}
      Security__RequireConfirmedAccount: "false"
      Proxy__Enabled: ${PROXY_ENABLED:-false}
      Proxy__KnownNetworks__0: ${TRUSTED_PROXY_NETWORK:-}
      Legal__OperatorName: ${LEGAL_OPERATOR_NAME:-}
      Legal__PrivacyContactEmail: ${PRIVACY_CONTACT_EMAIL:-}
      Legal__BackupRetentionDays: ${BACKUP_RETENTION_DAYS:-30}
      Legal__TelemetryRetentionDays: ${TELEMETRY_RETENTION_DAYS:-30}
      MultiInstance__Enabled: "true"
      MultiInstance__UseDistributedRateLimiting: "true"
      MultiInstance__UseSharedDataProtectionKeys: "true"
      AudioStorage__Provider: ${AUDIO_STORAGE_PROVIDER:-FileSystem}
      AudioStorage__CachePath: /var/lib/englishmaster/audio-cache
      AudioStorage__CreateContainerIfMissing: ${AUDIO_CREATE_CONTAINER_IF_MISSING:-false}
      AudioStorage__CdnBaseUrl: ${AUDIO_CDN_BASE_URL:-}
      AI__ApiKey: ${OPENAI_API_KEY:-}
      AI__ReferenceAudioCachePath: /var/lib/englishmaster/audio-cache
      AI__InputTokenUsdPerMillion: ${AI_INPUT_TOKEN_USD_PER_MILLION:-0}
      AI__OutputTokenUsdPerMillion: ${AI_OUTPUT_TOKEN_USD_PER_MILLION:-0}
      AI__SpeechUsdPerMillionCharacters: ${AI_SPEECH_USD_PER_MILLION_CHARACTERS:-0}
      AI__TranscriptionUsdPerMinute: ${AI_TRANSCRIPTION_USD_PER_MINUTE:-0}
      Pronunciation__Enabled: ${PRONUNCIATION_ENABLED:-false}
      Pronunciation__AzureSpeechKey: ${AZURE_SPEECH_KEY:-}
      Pronunciation__AzureSpeechRegion: ${AZURE_SPEECH_REGION:-}
      Observability__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      Alerting__Enabled: ${ALERTING_ENABLED:-false}
      Alerting__WebhookUrl: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - reference-audio:/var/lib/englishmaster/audio-cache
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
  reference-audio:
