name: englishmaster-staging

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migration:
    image: ${APP_IMAGE}
    restart: "no"
    command: ["dotnet", "EnglishMasterAI.Web.dll", "--migrate-and-seed"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      AllowedHosts: ${ALLOWED_HOSTS}
      Database__Provider: PostgreSql
      Database__ConnectionStringName: PostgreSqlConnection
      Database__ApplyMigrationsOnStartup: "false"
      Database__SeedOnStartup: "false"
      ConnectionStrings__PostgreSqlConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Security__RequireConfirmedAccount: "false"
      SeedAdmin__Enabled: "false"

  web:
    image: ${APP_IMAGE}
    restart: unless-stopped
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      AllowedHosts: ${ALLOWED_HOSTS}
      Database__Provider: PostgreSql
      Database__ConnectionStringName: PostgreSqlConnection
      Database__ApplyMigrationsOnStartup: "false"
      Database__SeedOnStartup: "false"
      ConnectionStrings__PostgreSqlConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      ConnectionStrings__AudioBlobStorage: ${AUDIO_BLOB_CONNECTION_STRING:-}
      Security__RequireConfirmedAccount: ${REQUIRE_CONFIRMED_ACCOUNT:-true}
      MultiInstance__Enabled: "true"
      MultiInstance__UseDistributedRateLimiting: "true"
      MultiInstance__UseSharedDataProtectionKeys: "true"
      AudioStorage__Provider: ${AUDIO_STORAGE_PROVIDER:-FileSystem}
      AudioStorage__CachePath: /var/lib/englishmaster/audio-cache
      AudioStorage__CreateContainerIfMissing: ${AUDIO_CREATE_CONTAINER_IF_MISSING:-false}
      AudioStorage__CdnBaseUrl: ${AUDIO_CDN_BASE_URL:-}
      Email__Enabled: ${EMAIL_ENABLED:-false}
      Email__Host: ${EMAIL_HOST:-}
      Email__Username: ${EMAIL_USERNAME:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-}
      AI__ApiKey: ${OPENAI_API_KEY:-}
      AI__ReferenceAudioCachePath: /var/lib/englishmaster/audio-cache
      Pronunciation__Enabled: ${PRONUNCIATION_ENABLED:-false}
      Pronunciation__AzureSpeechKey: ${AZURE_SPEECH_KEY:-}
      Pronunciation__AzureSpeechRegion: ${AZURE_SPEECH_REGION:-}
      Observability__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      Alerting__Enabled: ${ALERTING_ENABLED:-false}
      Alerting__WebhookUrl: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - reference-audio:/var/lib/englishmaster/audio-cache
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
  reference-audio:
